# Separate test app for the Shenava streaming models (not part of Keyless). CI generates the
# Xcode project with XcodeGen and puts the compiled models in Models/ (see shenava-app.yml).
name: ShenavaTest
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  ShenavaTest:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Models
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ShenavaTest
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: برای تبدیل هم‌زمان گفتار به متن روی خود گوشی.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.nikpendar.ShenavaTest
        PRODUCT_NAME: ShenavaTest
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
