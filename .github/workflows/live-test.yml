# Dictation end to end in the iOS Simulator: the app plays Persian speech (three FLEURS
# sentences) into a keyboard session (launch argument -testAudio), the keyboard records and
# should show the text while the speech plays. Then the dictated text is edited on the keys, and
# the correction should reach the training repository (Tests/github_stub.py stands in for
# GitHub); on the next launch the app should download, compile and load the model published there. Screenshots (portrait and
# landscape) and the app's log go to the `live-test` branch (`live-test-ios26` with ios 26).
name: Live dictation test

on:
  workflow_dispatch:
    inputs:
      ios:
        description: iOS major version of the simulator, built with that Xcode (empty for the runner's default)
        default: ""

permissions:
  contents: write

jobs:
  live:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        if: inputs.ios == '26'
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Download the speech model into the app
        run: bash ./setup.sh bundle

      - name: Build for the simulator
        run: |
          xcodebuild -project PersianSTT.xcodeproj -target PersianSTT \
            -configuration Release -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:|BUILD FAILED" build.log | head -n 40; exit 1; }
          tail -n 3 build.log

      - name: Install AXe (simulator taps)
        run: |
          brew tap cameroncooke/axe
          brew trust cameroncooke/axe || true
          brew install axe

      - name: Make the test recording
        run: |
          mkdir -p out fleurs
          base=https://huggingface.co/datasets/google/fleurs/resolve/main/data/fa_ir
          curl -fsSL -o dev.tsv "$base/dev.tsv"
          curl -fsSL -o dev.tar.gz "$base/audio/dev.tar.gz"
          tar xzf dev.tar.gz
          # Three sentences, 1.2 s of silence after each.
          head -n 3 dev.tsv | while IFS=$'\t' read -r id file raw norm rest; do
            python3 scripts/to_pcm16.py "$(find dev -name "$file" | head -1)" "fleurs/$file" > /dev/null
            echo "$raw" >> out/reference.txt
            echo "fleurs/$file" >> parts.txt
          done
          python3 - <<'PY'
          import wave
          frames = b""
          for path in open("parts.txt").read().split():
              with wave.open(path) as w:
                  frames += w.readframes(w.getnframes()) + b"\0\0" * 19200
          with wave.open("speech.wav", "wb") as out:
              out.setnchannels(1); out.setsampwidth(2); out.setframerate(16000); out.writeframes(frames)
          print("speech.wav", len(frames) / 32000, "s")
          PY
          cat out/reference.txt

      - name: Dictate in the simulator
        shell: bash
        run: |
          set -x
          APP=build/Release-iphonesimulator/PersianSTT.app
          ID=ir.nikpendar.PersianSTT
          KB=ir.nikpendar.PersianSTT.Keyboard
          if [ -n "${{ inputs.ios }}" ]; then
            RUNTIME="$(xcrun simctl list runtimes -j | jq -r --arg v "${{ inputs.ios }}." '[.runtimes[] | select(.isAvailable and .platform == "iOS" and (.version | startswith($v)))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')"
            DEVICE="$(xcrun simctl create live-test "iPhone 16 Pro" "$RUNTIME")"
          else
            DEVICE="$(xcrun simctl list devices available | grep -E 'iPhone 1[5-7] ' | grep -v Plus | head -n1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          fi
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl spawn "$DEVICE" defaults write -g AppleKeyboards -array "$KB"
          xcrun simctl spawn "$DEVICE" defaults write -g AppleKeyboardsExpanded -int 1
          for domain in -g com.apple.Preferences; do
            xcrun simctl spawn "$DEVICE" defaults write $domain KeyboardLastUsed "$KB"
            xcrun simctl spawn "$DEVICE" defaults write $domain KeyboardsCurrentAndNext -array "$KB" "$KB"
            xcrun simctl spawn "$DEVICE" defaults write $domain DidShowContinuousPathIntroduction -bool true
          done
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE"
          sleep 10

          # Finds an element's centre in AXe's UI dump by its accessibility identifier or label.
          cat > find.py <<'PY'
          import json, re, sys
          target = sys.argv[1]
          def walk(node):
              if isinstance(node, dict):
                  values = [str(v) for v in node.values() if isinstance(v, str)]
                  if target in values:
                      f = node.get("frame")
                      if isinstance(f, dict):
                          print(int(f["x"] + f["width"] / 2), int(f["y"] + f["height"] / 2)); sys.exit(0)
                      m = re.findall(r"[-\d.]+", str(node.get("AXFrame", "")))
                      if len(m) == 4:
                          x, y, w, h = map(float, m); print(int(x + w / 2), int(y + h / 2)); sys.exit(0)
                  for v in node.values(): walk(v)
              elif isinstance(node, list):
                  for v in node: walk(v)
          try:
              walk(json.load(open(sys.argv[2])))
          except Exception as e:
              print("parse error", e, file=sys.stderr)
          sys.exit(1)
          PY

          # GitHub stand-in; a corrected dictation should arrive in srv/samples.
          python3 Tests/github_stub.py "$PWD/srv" --port 8765 > out/server.log 2>&1 &
          TRAIN_ARGS=(-trainingUpload YES -trainingAPI http://127.0.0.1:8765 -trainingTestToken test-token -trainingRepository stub/repo)

          xcrun simctl spawn "$DEVICE" log stream --level info \
            --predicate 'subsystem == "ir.nikpendar.PersianSTT" OR process CONTAINS "PersianSTTKeyboard"' > out/log.txt 2>&1 &
          LOG=$!
          xcrun simctl launch "$DEVICE" "$ID" -keyboardTest 1 -testAudio "$PWD/speech.wav" "${TRAIN_ARGS[@]}"
          sleep 15
          xcrun simctl io "$DEVICE" screenshot out/1-keyboard.png
          dump() { for i in 1 2 3 4 5; do axe describe-ui --udid "$DEVICE" > "$1" 2>&1 && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$1" && return 0; sleep 2; done; return 1; }
          dump out/ui-1.json || true
          # Dictation: the space bar is held while the speech plays, then let go.
          read SPX SPY < <(python3 find.py spaceKey out/ui-1.json || echo "240 817")
          SPEECH="$(python3 -c 'import wave,sys; w=wave.open(sys.argv[1]); print(int(w.getnframes()/w.getframerate())+1)' speech.wav || echo 20)"
          echo "::notice::speech $SPEECH s"
          axe touch -x "$SPX" -y "$SPY" --down --udid "$DEVICE" || echo "::warning::touch down failed"
          # One screenshot only: each one costs the 3-core runner seconds of CPU and skews pass times.
          sleep 16
          xcrun simctl io "$DEVICE" screenshot out/2-recording-16s.png
          sleep "$(( SPEECH > 14 ? SPEECH - 14 : 2 ))"
          axe touch -x "$SPX" -y "$SPY" --up --udid "$DEVICE" || echo "::warning::touch up failed"
          grep -q "recording started, held" out/log.txt || echo "::error::holding the space bar did not start a held recording"
          sleep 1
          xcrun simctl io "$DEVICE" screenshot out/3-processing.png
          # The model has had all but the last fraction of a second while the speech played.
          for i in $(seq 60); do grep -q "final text" out/log.txt && break; sleep 2; done
          sleep 2
          xcrun simctl io "$DEVICE" screenshot out/4-done.png
          dump out/ui-4.json || true
          python3 - <<'PY'
          import json
          def walk(n):
              if isinstance(n, dict):
                  if n.get("AXUniqueId") == "testField" or n.get("role") == "AXTextField":
                      print("FIELD TEXT:", n.get("AXValue"))
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          try:
              walk(json.load(open("out/ui-4.json")))
          except Exception as e:
              print("no UI dump", e)
          PY

          # Correct the dictation on the keys: three backspaces and the letter ب.
          read BX BY < <(python3 find.py backspaceKey out/ui-4.json || echo "370 780")
          read LX LY < <(python3 find.py letter-1-3 out/ui-4.json || echo "125 735")
          for i in 1 2 3; do axe tap -x "$BX" -y "$BY" --udid "$DEVICE"; sleep 0.5; done
          axe tap -x "$LX" -y "$LY" --udid "$DEVICE"
          # The test keyboard reports edits after 40 s without typing; screenshots and UI dumps
          # before the taps take about 20 s.
          sleep 47
          xcrun simctl io "$DEVICE" screenshot out/4b-corrected.png
          echo "===== samples in the training repository"
          ls srv/samples || true
          cat srv/samples/*.json || echo "NO CORRECTION RECEIVED"

          # Glide typing: a swipe from س to م along the middle row should type سلام.
          dump out/ui-5.json || true
          read SX SY < <(python3 find.py letter-1-1 out/ui-5.json || echo "54 735")
          read MX2 MY2 < <(python3 find.py letter-1-8 out/ui-5.json || echo "300 735")
          # Slow enough to photograph the glass lens over the keys half way.
          axe swipe --start-x "$SX" --start-y "$SY" --end-x "$MX2" --end-y "$MY2" --duration 2.4 --udid "$DEVICE" &
          SWIPE=$!
          sleep 1.3
          xcrun simctl io "$DEVICE" screenshot out/5a0-glide-lens.png
          wait $SWIPE || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot out/5a-glide.png
          dump out/ui-5b.json || true
          python3 - <<'PY'
          import json
          def walk(n):
              if isinstance(n, dict):
                  if n.get("AXUniqueId") == "testField":
                      print("FIELD AFTER GLIDE:", n.get("AXValue") or n.get("AXLabel"))
                  if str(n.get("AXUniqueId", "")).startswith("suggestion-"):
                      print("BAR", n.get("AXUniqueId"), n.get("AXLabel"))
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          try:
              walk(json.load(open("out/ui-5b.json")))
          except Exception as e:
              print("no UI dump", e)
          PY
          # Next-word prediction after a space, then a typo («سلان») with its correction.
          bar() { # label, dump
            python3 - "$1" "$2" <<'PY'
          import json, sys
          def walk(n):
              if isinstance(n, dict):
                  if n.get("AXUniqueId") == "testField":
                      print(sys.argv[1], "FIELD:", n.get("AXValue") or n.get("AXLabel"))
                  if str(n.get("AXUniqueId", "")).startswith("suggestion-"):
                      print(sys.argv[1], "BAR", n.get("AXUniqueId"), n.get("AXLabel"))
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          try:
              walk(json.load(open(sys.argv[2])))
          except Exception as e:
              print("no UI dump", e)
          PY
          }
          read SPX SPY < <(python3 find.py spaceKey out/ui-5b.json || echo "240 817")
          axe tap -x "$SPX" -y "$SPY" --udid "$DEVICE"
          sleep 1
          dump out/ui-6.json || true
          bar PREDICTION out/ui-6.json
          for key in letter-1-1 letter-1-4 letter-1-5 letter-1-7; do
            read KX KY < <(python3 find.py "$key" out/ui-6.json || echo "0 0")
            axe tap -x "$KX" -y "$KY" --udid "$DEVICE"; sleep 0.4
          done
          sleep 1
          dump out/ui-7.json || true
          bar TYPO out/ui-7.json
          xcrun simctl io "$DEVICE" screenshot out/5e-typo.png
          # Long press on the emoji key: the menu with emoji and settings.
          read EX EY < <(python3 find.py emojiKey out/ui-5b.json || echo "60 817")
          axe touch -x "$EX" -y "$EY" --down --udid "$DEVICE" && sleep 0.8 && \
            xcrun simctl io "$DEVICE" screenshot out/5b-menu.png && axe touch -x "$EX" -y "$EY" --up --udid "$DEVICE" || true
          sleep 1
          xcrun simctl io "$DEVICE" screenshot out/5c-menu-open.png
          # A touch outside the open menu closes it.
          read CX CY < <(python3 find.py letter-0-9 out/ui-5b.json || echo "350 700")
          axe tap -x "$CX" -y "$CY" --udid "$DEVICE"
          sleep 1
          # Key popups: the enlarged letter while ب is down, then the forms of ا on a long press;
          # lifting the finger one cell to the left of ا should type آ.
          dump out/ui-8.json || true
          read BX BY < <(python3 find.py letter-1-3 out/ui-8.json || echo "125 735")
          axe touch -x "$BX" -y "$BY" --down --udid "$DEVICE" && \
            xcrun simctl io "$DEVICE" screenshot out/5f-preview.png; axe touch -x "$BX" -y "$BY" --up --udid "$DEVICE" || true
          sleep 0.5
          # A wide letter (س) in the enlarged popup.
          read SX SY < <(python3 find.py letter-1-1 out/ui-8.json || echo "40 735")
          axe touch -x "$SX" -y "$SY" --down --udid "$DEVICE" && \
            xcrun simctl io "$DEVICE" screenshot out/5f2-preview-wide.png; axe touch -x "$SX" -y "$SY" --up --udid "$DEVICE" || true
          sleep 0.5
          read AX AY < <(python3 find.py letter-1-5 out/ui-8.json || echo "196 735")
          read KX KY < <(python3 find.py letter-1-4 out/ui-8.json || echo "160 735")
          axe touch -x "$AX" -y "$AY" --down --udid "$DEVICE" && sleep 0.8 && \
            xcrun simctl io "$DEVICE" screenshot out/5g-variants.png; axe touch -x "$KX" -y "$AY" --up --udid "$DEVICE" || true
          sleep 1
          dump out/ui-9.json || true
          bar VARIANTS out/ui-9.json
          # The third row: nine letters and a double-width backspace.
          python3 - <<'PY'
          import json, re
          frames = {}
          def walk(n):
              if isinstance(n, dict):
                  uid = str(n.get("AXUniqueId", ""))
                  if uid.startswith("letter-2-") or uid == "backspaceKey":
                      f = n.get("frame") or {}
                      frames[uid] = (round(f.get("x", 0)), round(f.get("width", 0)))
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          try:
              walk(json.load(open("out/ui-9.json")))
          except Exception as e:
              print("no UI dump", e)
          print("THIRD ROW", sorted(frames.items()))
          PY

          # Frames (x, y, width, height) of the keys whose identifiers match a pattern.
          frames() { # label, dump, pattern
            python3 - "$1" "$2" "$3" <<'PY'
          import json, re, sys
          found = {}
          def walk(n):
              if isinstance(n, dict):
                  uid = str(n.get("AXUniqueId", ""))
                  if re.match(sys.argv[3], uid):
                      f = n.get("frame") or {}
                      found[uid] = tuple(round(f.get(k, 0)) for k in ("x", "y", "width", "height"))
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          try:
              walk(json.load(open(sys.argv[2])))
          except Exception as e:
              print("no UI dump", e)
          for uid, f in sorted(found.items(), key=lambda i: (i[1][1], i[1][0])):
              print(sys.argv[1], uid, f)
          PY
          }
          frames PERSIAN out/ui-9.json '^(letter-|backspaceKey|layerKey|emojiKey|spaceKey|returnKey|suggestion-)'
          read SPX SPY < <(python3 find.py spaceKey out/ui-9.json || echo "240 817")
          # Two quick spaces after a letter type a full stop.
          read BX BY < <(python3 find.py letter-1-3 out/ui-9.json || echo "125 735")
          axe tap -x "$BX" -y "$BY" --udid "$DEVICE"; sleep 0.4
          # Each axe call takes about a second to start; two started 0.4 s apart tap 0.4 s apart.
          axe tap -x "$SPX" -y "$SPY" --udid "$DEVICE" & T1=$!
          sleep 0.4; axe tap -x "$SPX" -y "$SPY" --udid "$DEVICE" & T2=$!
          wait $T1 $T2 || true
          sleep 1
          dump out/ui-9b.json || true
          bar DOUBLESPACE out/ui-9b.json
          # The enlarged letter over a key of the top row.
          read TX TY < <(python3 find.py letter-0-5 out/ui-9b.json || echo "200 690")
          axe touch -x "$TX" -y "$TY" --down --udid "$DEVICE" && \
            xcrun simctl io "$DEVICE" screenshot out/5k-top-preview.png; axe touch -x "$TX" -y "$TY" --up --udid "$DEVICE" || true
          sleep 0.5
          # Persian ۱۲۳ as on iOS, the diacritics on a long press, #+=, then back to the letters.
          read LKX LKY < <(python3 find.py layerKey out/ui-9b.json || echo "0 0")
          axe tap -x "$LKX" -y "$LKY" --udid "$DEVICE"; sleep 0.8
          xcrun simctl io "$DEVICE" screenshot out/5l-persian-numbers.png
          dump out/ui-12.json || true
          frames PERSIAN-NUMBERS out/ui-12.json '^(letter-|backspaceKey|layerKey|moreKey)'
          read DX DY < <(python3 find.py letter-2-6 out/ui-12.json || echo "0 0")
          axe touch -x "$DX" -y "$DY" --down --udid "$DEVICE" && sleep 0.8 && \
            xcrun simctl io "$DEVICE" screenshot out/5m-diacritics.png; axe touch -x "$DX" -y "$DY" --up --udid "$DEVICE" || true
          sleep 0.5
          read MKX MKY < <(python3 find.py moreKey out/ui-12.json || echo "0 0")
          axe tap -x "$MKX" -y "$MKY" --udid "$DEVICE"; sleep 0.8
          xcrun simctl io "$DEVICE" screenshot out/5n-persian-more.png
          axe tap -x "$LKX" -y "$LKY" --udid "$DEVICE"; sleep 0.5

          # Held briefly in silence: nothing is typed.
          read SPX SPY < <(python3 find.py spaceKey out/ui-5b.json || echo "240 817")
          axe touch -x "$SPX" -y "$SPY" --down --udid "$DEVICE"; sleep 3
          axe touch -x "$SPX" -y "$SPY" --up --udid "$DEVICE" || echo "::warning::touch up failed"
          sleep 4
          xcrun simctl io "$DEVICE" screenshot out/5d-no-speech.png

          # English layout: swipe along the space bar.
          read SPX SPY < <(python3 find.py spaceKey out/ui-5b.json || echo "240 817")
          axe swipe --start-x "$((SPX - 50))" --start-y "$SPY" --end-x "$((SPX + 50))" --end-y "$SPY" --udid "$DEVICE" || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot out/5-english.png
          dump out/ui-10.json || true
          frames ENGLISH out/ui-10.json '^(letter-|shiftKey|backspaceKey|layerKey|moreKey|emojiKey|spaceKey|returnKey)'
          # 123, then #+= for the third layer, then back to the letters.
          read LKX LKY < <(python3 find.py layerKey out/ui-10.json || echo "0 0")
          axe tap -x "$LKX" -y "$LKY" --udid "$DEVICE"; sleep 0.8
          xcrun simctl io "$DEVICE" screenshot out/5i-english-symbols.png
          dump out/ui-11.json || true
          read MKX MKY < <(python3 find.py moreKey out/ui-11.json || echo "0 0")
          axe tap -x "$MKX" -y "$MKY" --udid "$DEVICE"; sleep 0.8
          xcrun simctl io "$DEVICE" screenshot out/5j-english-more.png
          axe tap -x "$LKX" -y "$LKY" --udid "$DEVICE"; sleep 0.5
          # The repository gets a model (here a copy of the bundled one) for the next launch.
          mkdir -p srv/release
          cp build-model/Koochik.mlmodel srv/release/model.mlmodel
          python3 - <<'PY'
          import hashlib, json, os
          path = "srv/release/model.mlmodel"
          json.dump({"version": 1, "size": os.path.getsize(path),
                     "sha256": hashlib.sha256(open(path, "rb").read()).hexdigest(),
                     "wer_before": 20.0, "wer_after": 15.0, "samples": 1}, open("srv/release/release.json", "w"))
          json.dump({"samples": 1, "trained_on": 0, "result": "test"}, open("srv/status.json", "w"))
          PY
          # Landscape: the test build allows only landscape with -testLandscape.
          xcrun simctl terminate "$DEVICE" "$ID" || true
          xcrun simctl launch "$DEVICE" "$ID" -keyboardTest 1 -testAudio "$PWD/speech.wav" -testLandscape 1 \
            "${TRAIN_ARGS[@]}" -trainingAutoUpdate YES -personalModelLastCheck 0
          # Downloading and compiling 212 MB takes a while.
          for i in $(seq 90); do grep -q "installed personal model\|loaded personal-v1" out/log.txt && break; sleep 2; done
          sleep 5
          xcrun simctl io "$DEVICE" screenshot out/6-landscape.png
          # A preset picture behind clear keys, larger letters and the number row.
          xcrun simctl terminate "$DEVICE" "$ID" || true
          STYLE='{"fill":{"r":0.5,"g":0.5,"b":0.5,"a":0},"stroke":{"r":0.5,"g":0.5,"b":0.5,"a":0},"backgroundImage":"aurora","letterSize":28}'
          OPTIONS='{"numberRow":true}'
          xcrun simctl launch "$DEVICE" "$ID" -keyboardTest 1 -testAudio "$PWD/speech.wav" \
            -keyStyle "<$(printf '%s' "$STYLE" | xxd -p | tr -d '\n')>" -keyboardOptions "<$(printf '%s' "$OPTIONS" | xxd -p | tr -d '\n')>"
          sleep 12
          xcrun simctl io "$DEVICE" screenshot out/7-background.png
          dump out/ui-13.json || true
          frames BACKGROUND out/ui-13.json '^(number-|letter-0-0|spaceKey)'
          read DX DY < <(python3 find.py letter-1-5 out/ui-13.json || echo "0 0")
          axe touch -x "$DX" -y "$DY" --down --udid "$DEVICE" && sleep 0.8 && \
            xcrun simctl io "$DEVICE" screenshot out/7b-background-variants.png; axe touch -x "$DX" -y "$DY" --up --udid "$DEVICE" || true
          # The glide lens over the picture and clear keys.
          read GX GY < <(python3 find.py letter-1-1 out/ui-13.json || echo "54 735")
          read HX HY < <(python3 find.py letter-1-8 out/ui-13.json || echo "300 735")
          axe swipe --start-x "$GX" --start-y "$GY" --end-x "$HX" --end-y "$HY" --duration 2.4 --udid "$DEVICE" &
          SWIPE=$!
          sleep 1.3
          xcrun simctl io "$DEVICE" screenshot out/7c-background-glide-lens.png
          wait $SWIPE || true
          # The keys moved up under a thin margin with the suggestion row off.
          xcrun simctl terminate "$DEVICE" "$ID" || true
          OPTIONS='{"suggestionBar":false}'
          xcrun simctl launch "$DEVICE" "$ID" -keyboardTest 1 -testAudio "$PWD/speech.wav" \
            -keyboardOptions "<$(printf '%s' "$OPTIONS" | xxd -p | tr -d '\n')>"
          sleep 10
          xcrun simctl io "$DEVICE" screenshot out/7d-no-suggestion-row.png
          dump out/ui-14.json || true
          frames NOBAR out/ui-14.json '^(letter-0-0|letter-3-0|spaceKey)'
          # The app's settings: the colours page, then the typing page before and after the
          # suggestion row is switched off (its switch is on the left, the page being right to left).
          cat > pick.py <<'PY'
          import json, sys
          target, path = sys.argv[1], sys.argv[2]
          found = []
          def walk(n):
              if isinstance(n, dict):
                  if n.get("AXLabel") == target and isinstance(n.get("frame"), dict):
                      found.append((str(n.get("type") or n.get("role") or ""), n["frame"]))
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          walk(json.load(open(path)))
          best = [f for k, f in found if k not in ("StaticText", "Heading")] or [f for _, f in found]
          if not best: sys.exit(1)
          f = best[0]
          x = f["x"] + 40 if len(sys.argv) > 3 else f["x"] + f["width"] / 2
          print(int(x), int(f["y"] + f["height"] / 2))
          PY
          xcrun simctl terminate "$DEVICE" "$ID" || true
          xcrun simctl launch "$DEVICE" "$ID"
          sleep 6
          dump out/ui-15.json || true
          read PX PY_ < <(python3 pick.py "ظاهر دکمه‌ها" out/ui-15.json || echo "200 500")
          axe tap -x "$PX" -y "$PY_" --udid "$DEVICE"; sleep 2
          xcrun simctl io "$DEVICE" screenshot out/8a-settings-colours.png
          xcrun simctl terminate "$DEVICE" "$ID" || true
          xcrun simctl launch "$DEVICE" "$ID"
          sleep 6
          read PX PY_ < <(python3 pick.py "تایپ و پیشنهاد کلمه" out/ui-15.json || echo "200 450")
          axe tap -x "$PX" -y "$PY_" --udid "$DEVICE"; sleep 2
          xcrun simctl io "$DEVICE" screenshot out/8b-settings-typing.png
          dump out/ui-16.json || true
          read PX PY_ < <(python3 pick.py "نمایش ردیف پیشنهاد" out/ui-16.json switch || echo "60 200")
          axe tap -x "$PX" -y "$PY_" --udid "$DEVICE"; sleep 1.5
          xcrun simctl io "$DEVICE" screenshot out/8c-settings-no-suggestion-row.png
          kill $LOG || true
          echo "===== log"
          grep -E "final text|stream|recording started|test audio|correction|personal|loaded|model|edits|dictation |auto stop|no speech|glide|keyboard given" out/log.txt | cut -c1-300 || true
          echo "===== GitHub stand-in"
          cat out/server.log || true
          ls ~/Library/Logs/DiagnosticReports/ | grep -i persian && cp ~/Library/Logs/DiagnosticReports/*PersianSTT* out/ || echo "no crash reports"

      - name: Commit results
        if: always()
        run: |
          cd out
          BRANCH=live-test
          if [ -n "${{ inputs.ios }}" ]; then BRANCH="live-test-ios${{ inputs.ios }}"; fi
          git init -q -b "$BRANCH"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Live test for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$BRANCH"
