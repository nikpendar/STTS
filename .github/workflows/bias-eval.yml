# Contextual biasing (personal dictionary words favoured in decoding, ShenavaStream.setBoost):
# the app's recognizer on the same 80 FLEURS and 80 Common Voice 17 clips as the model benchmarks,
# without boost and with boost strengths 1, 2 and 3. Dictionary: 40 reference words the plain model
# misses plus 40 rare words no clip says (scripts/bias_lists.py); also the 40 unsaid words alone,
# which must not make the error rate worse. Nothing here changes the app or its build.
name: Biasing benchmark

on:
  push:
    branches: [batch-1021c]
    paths: [.github/workflows/bias-eval.yml, scripts/bias_lists.py, scripts/bias_recall.py, Tests/ShenavaCheck/main.swift]
  workflow_dispatch:

jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FLEURS fa_ir test, first 80
        run: |
          base=https://huggingface.co/datasets/google/fleurs/resolve/main/data/fa_ir
          curl -fsSL --retry 3 -o test.tsv "$base/test.tsv"
          curl -fsSL --retry 3 -o test.tar.gz "$base/audio/test.tar.gz"
          tar xzf test.tar.gz
          mkdir -p fleurs
          head -n 80 test.tsv | while IFS=$'\t' read -r id file raw norm rest; do
            src=$(find test -name "$file" | head -1)
            [ -n "$src" ] || continue
            python3 scripts/to_pcm16.py "$src" "fleurs/$file" >> durations
            printf '%s\t%s\n' "$file" "$raw" >> fleurs/refs.tsv
          done
          awk '{ s += $1 } END { printf "%.1f", s }' durations > fleurs/audio_seconds
          tail -n +81 test.tsv | cut -f3 > fleurs/extra.sentences
          echo "fleurs: $(wc -l < fleurs/refs.tsv) clips, $(cat fleurs/audio_seconds) s"
      - name: Common Voice 17 fa test, 80 spread
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          base=https://huggingface.co/datasets/fsicoli/common_voice_17_0/resolve/main
          curl -fsSL --retry 3 -o cv.tsv "$base/transcript/fa/test.tsv"
          curl -fsSL --retry 3 -o cv.tar "$base/audio/fa/test/fa_test_0.tar"
          python3 scripts/prepare_cv.py cv.tsv cv.tar 80 cv17
          ls cv17/*.wav | wc -l
      - uses: actions/upload-artifact@v5
        with:
          name: clips
          path: |
            fleurs
            cv17
          retention-days: 3

  eval:
    needs: clips
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: clips
      - name: Model and recognizer
        run: |
          bash ./setup.sh model
          mkdir -p "$RUNNER_TEMP/Koochik.mlpackage"
          aa extract -d "$RUNNER_TEMP/Koochik.mlpackage" -i build-model/Koochik.aar
          xcrun coremlcompiler compile "$RUNNER_TEMP/Koochik.mlpackage" compiled --deployment-target 17.0 --platform ios
          xcrun swiftc -O -o shenava-check PersianSTT/ShenavaStream.swift Tests/ShenavaCheck/main.swift
      - name: Transcribe and score
        run: |
          mkdir -p result lists
          run() {  # label, word list or "", strength
            for ds in fleurs cv17; do
              BOOST_WORDS="$2" BOOST="$3" ./shenava-check compiled/*.mlmodelc PersianSTT/Models "$ds" all > "result/$1-$ds.log"
              grep -E "BOOST|TIMING" "result/$1-$ds.log"
              python3 scripts/wer.py "$ds/refs.tsv" "$ds" "$1" 0 0 1 "result/$1-$ds.json" > /dev/null
              mkdir -p "result/hyp-$1-$ds" && mv "$ds"/*.txt "result/hyp-$1-$ds/"
            done
            fw=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["wer"])' "result/$1-fleurs.json")
            cw=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["wer"])' "result/$1-cv17.json")
            boosted=$(cat result/$1-*.log | sed -nE 's/BOOSTED tokens=([0-9]+)/\1/p' | paste -sd+ - | bc)
            recall=$(python3 scripts/bias_recall.py lists/targets.txt "fleurs/refs.tsv:result/hyp-$1-fleurs" "cv17/refs.tsv:result/hyp-$1-cv17")
            echo "| $1 | $fw | $cw | $recall | $boosted |" | tee -a result/table.md
          }
          # The plain model first: its misses make the dictionary.
          for ds in fleurs cv17; do
            ./shenava-check compiled/*.mlmodelc PersianSTT/Models "$ds" all > /dev/null
            mkdir -p "base-$ds" && cp "$ds"/*.txt "base-$ds/" && rm "$ds"/*.txt
          done
          python3 scripts/bias_lists.py lists fleurs/extra.sentences fleurs/refs.tsv:base-fleurs cv17/refs.tsv:base-cv17
          cp lists/*.txt result/
          echo "| run | FLEURS WER | CV WER | dictionary words recognized (% found/said) | boosted tokens |" > result/table.md
          echo "|---|---|---|---|---|" >> result/table.md
          run plain "" 0
          for s in 1 2 3; do
            run "dict-$s" lists/dictionary.txt $s
            run "unsaid-$s" lists/distractors.txt $s
          done
          cat result/table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bias-result
          path: result
