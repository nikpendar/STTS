# Installs the app in the iOS Simulator, enables the dictation keyboard as the only
# keyboard, focuses a text field and records whether the extension launches.
# The screenshots and system log go to the branch `keyboard-test-<ref>`.
name: Keyboard test

on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device type
        default: iPhone 11 Pro
      ios:
        description: iOS major version of the simulator runtime (and of the Xcode that builds)
        default: "26"

permissions:
  contents: write

jobs:
  keyboard:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        if: inputs.ios == '26'
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Download the speech model's sidecars
        run: bash ./setup.sh sidecars

      - name: Build for the simulator
        run: |
          xcodebuild -project PersianSTT.xcodeproj -target PersianSTT \
            -configuration Release -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:|BUILD FAILED" build.log | head -n 40; exit 1; }
          tail -n 3 build.log
          ls build/Release-iphonesimulator/PersianSTT.app/PlugIns

      - name: Install AXe (simulator taps)
        continue-on-error: true
        run: |
          brew tap cameroncooke/axe
          brew trust cameroncooke/axe || true
          brew install axe
          axe --version

      - name: Run the keyboard
        run: |
          set -x
          APP=build/Release-iphonesimulator/PersianSTT.app
          ID=ir.nikpendar.PersianSTT
          KB=ir.nikpendar.PersianSTT.Keyboard
          xcrun simctl list runtimes
          RUNTIME="$(xcrun simctl list runtimes -j | jq -r --arg v "${{ inputs.ios }}." '[.runtimes[] | select(.isAvailable and .platform == "iOS" and (.version | startswith($v)))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')"
          DEVICE="$(xcrun simctl create keyboard-test "${{ inputs.device }}" "$RUNTIME")"
          echo "device ${{ inputs.device }} on $RUNTIME" > device.txt
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          # Only the dictation keyboard, so it is the one shown for any text field.
          xcrun simctl spawn "$DEVICE" defaults write -g AppleKeyboards -array "$KB"
          xcrun simctl spawn "$DEVICE" defaults write -g AppleKeyboardsExpanded -int 1
          for domain in -g com.apple.Preferences; do
            xcrun simctl spawn "$DEVICE" defaults write $domain KeyboardLastUsed "$KB"
            xcrun simctl spawn "$DEVICE" defaults write $domain KeyboardsCurrentAndNext -array "$KB" "$KB"
            xcrun simctl spawn "$DEVICE" defaults write $domain DidShowContinuousPathIntroduction -bool true
          done
          xcrun simctl spawn "$DEVICE" defaults write com.apple.Preferences HardwareKeyboardLastSeen -bool false
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE"
          sleep 10
          xcrun simctl spawn "$DEVICE" defaults read -g AppleKeyboards || true
          xcrun simctl spawn "$DEVICE" defaults read -g KeyboardsCurrentAndNext || true
          mkdir -p out
          mv device.txt out/
          xcrun simctl spawn "$DEVICE" log stream --level debug \
            --predicate 'process == "PersianSTT" OR process CONTAINS "PersianSTTKeyboard" OR process == "kbd" OR process == "InputUI" OR eventMessage CONTAINS "PersianSTT" OR eventMessage CONTAINS[c] "inputmode" OR eventMessage CONTAINS[c] "keyboard-service" OR (process == "runningboardd" AND eventMessage CONTAINS "Keyboard")' \
            > out/log.txt 2>&1 &
          LOG=$!
          sleep 3
          xcrun simctl launch "$DEVICE" "$ID" -keyboardTest 1
          sleep 15
          xcrun simctl io "$DEVICE" screenshot out/keyboard-test.png
          # Tap the globe key (bottom-left) until the system keyboard (UIKeyboardLayoutStar) gives way
          # to ours, whose keys the accessibility dump does not show.
          axe describe-ui --udid "$DEVICE" > out/ui.json 2>&1 || true
          HEIGHT="$(jq -r '[.. | objects | .frame?.height? // empty] | max' out/ui.json 2>/dev/null || true)"
          HEIGHT="${HEIGHT%%.*}"
          case "$HEIGHT" in ''|*[!0-9]*) HEIGHT=874 ;; esac
          [ "$HEIGHT" -gt 400 ] || HEIGHT=874
          GLOBE_Y=$((HEIGHT - 41))
          for i in 2 3 4 5; do
            grep -q 'UIKeyboardLayoutStar' "out/ui.json" || break
            axe tap --label "Next keyboard" --udid "$DEVICE" || axe tap -x 42 -y "$GLOBE_Y" --udid "$DEVICE" || true
            sleep 10
            xcrun simctl io "$DEVICE" screenshot "out/keyboard-test-$i.png"
            axe describe-ui --udid "$DEVICE" > out/ui.json 2>&1 || true
          done
          # The keyboard in other text fields: the height iOS gives it should be the same everywhere.
          mark() { echo "===== $1 $(date +%T)" | tee -a out/hosts.txt; sleep 9; xcrun simctl io "$DEVICE" screenshot "out/host-$1.png"
            PID="$(pgrep -f PersianSTTKeyboard | head -n1)"
            [ -n "$PID" ] && footprint "$PID" 2>/dev/null | grep -iE "footprint|phys" | head -n 3 | tee -a out/hosts.txt || echo "no keyboard process" | tee -a out/hosts.txt; }
          spotlight() { axe button home --udid "$DEVICE" || xcrun simctl launch "$DEVICE" com.apple.springboard || true; sleep 3
            axe swipe --start-x 187 --start-y 330 --end-x 187 --end-y 640 --duration 0.4 --udid "$DEVICE" || true; }
          mark 1-app
          spotlight; mark 2-spotlight
          xcrun simctl launch "$DEVICE" com.apple.mobilesafari; sleep 6
          axe describe-ui --udid "$DEVICE" > out/ui-safari.json 2>&1 || true
          axe tap --label "Address" --udid "$DEVICE" || axe tap --label "Search or enter website name" --udid "$DEVICE" \
            || axe tap -x 187 -y 770 --udid "$DEVICE" || true
          mark 3-safari
          xcrun simctl terminate "$DEVICE" "$ID" || true
          xcrun simctl launch "$DEVICE" "$ID" -keyboardTest 1; mark 4-app-again
          spotlight; mark 5-spotlight-again
          xcrun simctl launch "$DEVICE" com.apple.reminders; sleep 6
          axe tap --label "New Reminder" --udid "$DEVICE" || true
          mark 6-reminders
          kill $LOG || true
          ls ~/Library/Logs/DiagnosticReports/ | grep -i persian || echo "no crash reports"
          cp ~/Library/Logs/DiagnosticReports/*PersianSTT* out/ 2>/dev/null || true
          echo "===== keyboard sizes"
          grep -E "keyboard\] (layout|keyboard given)" out/log.txt | sed -E 's/^[0-9-]+ ([0-9:.]+).*\] /\1 /' | tee out/sizes.txt
          cat out/hosts.txt
          echo "===== log (filtered)"
          grep -v "constructing bundle record" out/log.txt | grep -iE "inputmode|extension|PersianSTTKeyboard|xpcservice|PersianSTT.Keyboard|fail|error" | grep -v "Memorystatus\|Carplay\|cfprefsd" | cut -c1-400 | head -200

      - name: Commit results
        if: always()
        run: |
          cd out
          git init -q -b "keyboard-test-${GITHUB_REF_NAME}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Keyboard test for ${GITHUB_SHA::7}: $(cat device.txt 2>/dev/null)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "keyboard-test-${GITHUB_REF_NAME}"
