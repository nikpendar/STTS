# Screenshots and accessibility dumps of the system Persian keyboard's layers in the
# iOS Simulator, as a reference for the extension's layout. Results go to the
# `ios-keyboard` branch.
name: iOS keyboard reference

on:
  push:
    branches: [ios-ref]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Download whisper.xcframework and model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./setup.sh base-q5_1

      - name: Build for the simulator
        run: |
          xcodebuild -project PersianSTT.xcodeproj -target PersianSTT \
            -configuration Release -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:|BUILD FAILED" build.log | head -n 40; exit 1; }
          tail -n 3 build.log

      - name: Install AXe (simulator taps)
        run: |
          brew tap cameroncooke/axe
          brew trust cameroncooke/axe || true
          brew install axe

      - name: Keyboard rows on several iPhones in portrait
        timeout-minutes: 30
        run: |
          set -x
          mkdir -p out
          APP=build/Release-iphonesimulator/PersianSTT.app
          ID=ir.nikpendar.PersianSTT
          RUNTIME="$(xcrun simctl list runtimes available | grep -E '^iOS' | tail -n1 | sed -E 's/.* - (com\.apple[^ ]+).*/\1/')"
          xcrun simctl list devicetypes | grep -i iphone > out/devicetypes.txt
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          cat > rows.py <<'EOF'
          import json, sys
          rows = {}
          def walk(n):
              if isinstance(n, dict):
                  f = n.get("frame")
                  if n.get("type") == "Button" and isinstance(f, dict) and 20 < f["height"] < 80:
                      rows.setdefault((round(f["y"]), round(f["height"])), []).append((round(f["x"]), round(f["width"]), n.get("AXLabel")))
                  if n.get("type") == "Application" and isinstance(f, dict):
                      print("screen", f["width"], f["height"])
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          try:
              walk(json.load(open(sys.argv[1])))
          except Exception as e:
              print(sys.argv[1], e); sys.exit(0)
          for (y, h), keys in sorted(rows.items()):
              print(y, h, sorted(keys)[:2], len(keys))
          EOF
          for type in iPhone-SE-3rd-generation iPhone-11 iPhone-16 iPhone-16-Plus iPhone-16-Pro-Max; do
            DEVICE="$(xcrun simctl create "$type" "com.apple.CoreSimulator.SimDeviceType.$type" "$RUNTIME" 2>/dev/null || true)"
            [ -n "$DEVICE" ] || { echo "no $type" >> out/rows.txt; continue; }
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl install "$DEVICE" "$APP"
            open -a Simulator --args -CurrentDeviceUDID "$DEVICE"
            sleep 5
            xcrun simctl launch "$DEVICE" "$ID" -keyboardTest 1
            sleep 10
            xcrun simctl io "$DEVICE" screenshot "out/$type-portrait.png"
            axe describe-ui --udid "$DEVICE" > "out/$type-portrait.json" 2>&1 || true
            echo "== $type portrait" >> out/rows.txt
            python3 rows.py "out/$type-portrait.json" >> out/rows.txt
            # The app allows only landscape with -testLandscape; the keyboard should follow it.
            xcrun simctl terminate "$DEVICE" "$ID" || true
            xcrun simctl launch "$DEVICE" "$ID" -keyboardTest 1 -testLandscape 1
            sleep 8
            xcrun simctl io "$DEVICE" screenshot "out/$type-landscape.png"
            axe describe-ui --udid "$DEVICE" > "out/$type-landscape.json" 2>&1 || true
            echo "== $type landscape" >> out/rows.txt
            python3 rows.py "out/$type-landscape.json" >> out/rows.txt
            tail -n 20 out/rows.txt
            xcrun simctl shutdown "$DEVICE" || true
          done
          cat out/rows.txt

      - name: Commit results
        if: always()
        run: |
          cd out
          git init -q -b ios-keyboard
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "iOS keyboard reference for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ios-keyboard
