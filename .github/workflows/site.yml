# Publishes the website in site/ (introduction and privacy policy) to Cloudflare Pages, at
# https://<project>.pages.dev until a domain is bought. Needs the repository secrets
# CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
# Rooz (2026-11-01): Cloudflare for the site and, later, the server (Workers, D1, R2).
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

concurrency: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: keyless
    steps:
      - uses: actions/checkout@v5
      - name: Check the secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Create the Pages project once
        run: |
          npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT" \
            || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
      - name: Publish
        run: |
          npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true | tee deploy.txt
          URL="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.txt | tail -n 1)"
          echo "::notice::published ${URL:-(address not found in the output)}"
