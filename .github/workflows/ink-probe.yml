# Lists what of ML Kit is inside the built IPA.
name: ink-probe
on:
  push:
    branches: [batch-1021c]
    paths: [.github/workflows/ink-probe.yml]
permissions: { actions: read, contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh run download 41811326455 -R ${{ github.repository }} -n KeylessShenava -D ipa
          ls -la ipa
          unzip -l ipa/*.ipa | grep -iE "appex/[^/]*$|mlkit|resource.bundle|manifest.json|packmapping|GoogleService|Info.plist$" | head -40
          mkdir x && cd x && unzip -q ../ipa/*.ipa
          K=$(find . -name "*.appex" -maxdepth 4 | head -1); echo "$K"
          plutil() { python3 -c "import plistlib,sys,json;print(json.dumps(plistlib.load(open(sys.argv[1],'rb')),indent=1,default=str))" "$1"; }
          plutil "$K/Info.plist" | head -80
