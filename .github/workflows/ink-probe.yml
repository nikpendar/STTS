# Finds where ML Kit downloads the handwriting model from (strings in its binaries).
name: ink-probe
on:
  push:
    branches: [batch-1021c]
    paths: [.github/workflows/ink-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://dl.google.com/dl/cpdc/95473d50497208d4/MLKitDigitalInkRecognition-8.0.0.tar.gz \
                   https://dl.google.com/dl/cpdc/b14ff2c7cc91cb0f/MLKitMDD-10.0.0.tar.gz \
                   https://dl.google.com/dl/cpdc/00f258dabdb58dfa/MLKitCommon-14.0.0.tar.gz; do
            n=$(basename $u .tar.gz); mkdir -p $n; curl -sSL $u | tar xz -C $n
          done
          find . -type d | head -60
          find . -type f -size +50k ! -name "*.h" > bins.txt
          cat bins.txt
          echo "=== sizes"
          for f in fa.20191215.compact.fst.zip indy_lstm.arabic.5x272.tflite.20191215.zip; do
            curl -sSIL https://dl.google.com/handwriting/models/$f | grep -Ei '^(HTTP|content-length|last-modified)'
          done
          echo "=== hints"
          xargs -a bins.txt strings -n 6 > all.txt
          grep -Ei 'backgroundSession|sharedContainer|URLSessionConfiguration|appex|extension|isModelDownloaded|ModelDownload|Library/|Application Support|Caches|ml_kit|mlkit' all.txt | grep -v handwriting/models | sort -u | head -150 || true
