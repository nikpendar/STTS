# Finds how ML Kit stores the handwriting model on the device.
name: ink-probe
on:
  push:
    branches: [batch-1021c]
    paths: [.github/workflows/ink-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://dl.google.com/dl/cpdc/95473d50497208d4/MLKitDigitalInkRecognition-8.0.0.tar.gz \
                   https://dl.google.com/dl/cpdc/b14ff2c7cc91cb0f/MLKitMDD-10.0.0.tar.gz \
                   https://dl.google.com/dl/cpdc/00f258dabdb58dfa/MLKitCommon-14.0.0.tar.gz; do
            n=$(basename $u .tar.gz); mkdir -p $n; curl -sSL $u | tar xz -C $n
          done
          for b in MLKitDigitalInkRecognition MLKitMDD MLKitCommon; do strings -n 5 $(find . -type f -name $b) > $b.txt; done
          cat MLKitDigitalInkRecognition-8.0.0/Frameworks/MLKitDigitalInkRecognition.framework/MLKitDigitalInkRecognition_resource.bundle/manifest.json | head -c 3000; echo
          for b in MLKitDigitalInkRecognition MLKitMDD MLKitCommon; do
            echo "=== $b"
            grep -Ei 'Application Support|NSApplicationSupport|NSCachesDirectory|NSDocument|NSLibrary|com\.google|mlkit/|models/|digitalink|digital_ink|\.fst|indy_|tflite|modelsDirectory|modelPath|localModel|LocalModel|isModelDownloaded|downloadedModels|unzip|SSZip|@"[a-z_]+/%@' $b.txt | grep -v 'dl.google.com/handwriting/models' | grep -v descriptor | sort -u | head -200 || true
          done
          mkdir out; cp *.txt out/
      - uses: actions/upload-artifact@v4
        with: { name: strings, path: out }
