# Builds the keyboard's next-word list (PersianSTTKeyboard/fa_bigrams.bin) from Persian
# Wikipedia with scripts/make_bigrams.py and commits it to the branch the run is on. The log
# shows sample predictions.
name: Keyboard word lists

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/make_bigrams.py
      - .github/workflows/wordlists.yml

permissions:
  contents: write

jobs:
  bigrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Persian Wikipedia
        run: |
          pip install -q pyarrow numpy huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("wikimedia/wikipedia", repo_type="dataset", allow_patterns="20231101.fa/*", local_dir="wiki")
          PY

      - name: Count word pairs
        run: python scripts/make_bigrams.py PersianSTTKeyboard/fa_words.txt wiki/20231101.fa/*.parquet PersianSTTKeyboard/fa_bigrams.bin

      # Pushes made with the workflow token start no other workflow, so this builds no IPA.
      - name: Commit the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersianSTTKeyboard/fa_bigrams.bin
          git diff --cached --quiet && exit 0
          git commit -m "Update the next-word list from Persian Wikipedia"
          git push origin "HEAD:${GITHUB_REF_NAME}"
