# Builds the keyboard's next-word list (PersianSTTKeyboard/fa_bigrams.bin) from Persian
# Wikipedia with scripts/make_bigrams.py and uploads it as the `fa-bigrams` artifact, to be
# committed after a look at the sample predictions in the log.
name: Keyboard word lists

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/make_bigrams.py
      - .github/workflows/wordlists.yml

jobs:
  bigrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Persian Wikipedia
        run: |
          pip install -q pyarrow numpy huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("wikimedia/wikipedia", repo_type="dataset", allow_patterns="20231101.fa/*", local_dir="wiki")
          PY
          ls -la wiki/20231101.fa

      - name: Count word pairs
        run: python scripts/make_bigrams.py PersianSTTKeyboard/fa_words.txt wiki/20231101.fa/*.parquet fa_bigrams.bin

      - uses: actions/upload-artifact@v4
        with:
          name: fa-bigrams
          path: fa_bigrams.bin
