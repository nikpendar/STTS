# Builds an unsigned PersianSTT.ipa on a GitHub macOS runner (no local Mac/Xcode needed).
# Install the resulting .ipa on an iPhone with Sideloadly or AltStore, which sign it with your Apple ID.
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Whisper model (base-q5_1, small-q5_1, large-v3-turbo-q5_0)"
        default: large-v3-turbo-q5_0
      hf:
        description: "Persian fine-tuned Hugging Face model to bundle (none = use the model above)"
        default: farbodbij/whisper-medium-Persian
      quant:
        description: "Quantization for the Hugging Face model"
        default: q4_0
      coreml:
        description: "Run the encoder on the Neural Engine (Core ML). Too heavy for 4 GB iPhones with turbo."
        type: boolean
        default: false
  push:
    branches: [main]
    # Benchmark tooling does not change the app.
    paths-ignore:
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/hf-search.yml"
      - ".github/workflows/screenshots.yml"
      - ".github/workflows/keyboard-test.yml"
      - "scripts/wer.py"
      - "scripts/to_pcm16.py"
      - "scripts/prepare_hf_model.py"
      - "scripts/prepare_cv.py"
      - "scripts/export_nemo_ctc.py"
      - "scripts/sherpa_transcribe.py"

env:
  MODEL: ${{ github.event.inputs.model || 'large-v3-turbo-q5_0' }}
  COREML: ${{ github.event.inputs.coreml == 'true' }}
  # Default: Persian fine-tuned Whisper medium, q4_0 (444 MB). FLEURS WER 11.3%, Common Voice 20.2%,
  # against 20.6% / 46.1% for stock turbo q5_0 (574 MB). Pass hf=none to bundle the model input instead.
  HF: ${{ github.event.inputs.hf != 'none' && (github.event.inputs.hf || 'farbodbij/whisper-medium-Persian') || '' }}
  QUANT: ${{ github.event.inputs.quant || 'q4_0' }}

jobs:
  # Converts a fine-tuned Hugging Face Whisper checkpoint to a quantized ggml model.
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: env.HF != ''
      - name: Convert and quantize
        if: env.HF != ''
        run: |
          git clone -q --depth 1 --branch v1.7.5 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build -j 4
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch transformers safetensors huggingface_hub numpy
          git clone -q --depth 1 https://github.com/openai/whisper openai-whisper
          python3 scripts/prepare_hf_model.py "$HF" hf-model
          mkdir -p converted out
          python3 whisper.cpp/models/convert-h5-to-ggml.py hf-model openai-whisper converted
          NAME="$(basename "$HF" | tr '[:upper:]' '[:lower:]')"
          "$(find whisper.cpp/build/bin -name '*quantize*' -type f | head -1)" converted/ggml-model.bin "out/ggml-$NAME-$QUANT.bin" "$QUANT"
          ls -la out
      - uses: actions/upload-artifact@v5
        if: env.HF != ''
        with:
          name: hf-model
          path: out/*.bin
          retention-days: 1

  build:
    needs: convert
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Download whisper.xcframework and model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # With a Hugging Face model, only the framework is needed here; the small base model is replaced below.
        run: bash ./setup.sh "$([ -n "$HF" ] && echo base-q5_1 || echo "$MODEL")"

      - uses: actions/download-artifact@v5
        if: env.HF != ''
        with:
          name: hf-model
          path: hf-model

      - name: Use the converted model
        if: env.HF != ''
        run: |
          find PersianSTT/Models -name 'ggml-*.bin' -delete
          mv hf-model/*.bin PersianSTT/Models/
          ls -la PersianSTT/Models

      - uses: actions/setup-python@v6
        if: env.COREML == 'true'
        with:
          python-version: "3.11"

      - name: Convert encoder to Core ML (int8)
        if: env.COREML == 'true'
        run: |
          # whisper.cpp looks for ggml-<name>-encoder.mlmodelc next to ggml-<name>[-qX_Y].bin
          NAME="$(echo "$MODEL" | sed -E 's/-q[0-9]_[0-9k]$//')"
          pip install --quiet torch coremltools openai-whisper ane_transformers
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"
          python scripts/convert_encoder_coreml.py "$RUNNER_TEMP/whisper.cpp" "$NAME" "$RUNNER_TEMP/encoder.mlpackage" --int8
          xcrun coremlc compile "$RUNNER_TEMP/encoder.mlpackage" "$RUNNER_TEMP"
          rm -rf "PersianSTT/Models/ggml-$NAME-encoder.mlmodelc"
          mv "$RUNNER_TEMP/encoder.mlmodelc" "PersianSTT/Models/ggml-$NAME-encoder.mlmodelc"
          du -sh PersianSTT/Models/*

      - name: Build
        run: |
          xcodebuild -project PersianSTT.xcodeproj -target PersianSTT \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PersianSTT.app Payload/
          # The dictation keyboard must be embedded, or iOS never lists it.
          ls Payload/PersianSTT.app/PlugIns/PersianSTTKeyboard.appex
          plutil -p Payload/PersianSTT.app/PlugIns/PersianSTTKeyboard.appex/Info.plist
          # AltServer names Apple App IDs after CFBundleDisplayName and rejects non-ASCII names,
          # so Info.plist gets English names and the Persian ones move to InfoPlist.strings.
          APP=Payload/PersianSTT.app
          KB=$APP/PlugIns/PersianSTTKeyboard.appex
          plutil -replace CFBundleDisplayName -string "PersianSTT" "$APP/Info.plist"
          plutil -replace CFBundleDisplayName -string "Persian Dictation" "$KB/Info.plist"
          for lang in Base en fa; do
            mkdir -p "$APP/$lang.lproj" "$KB/$lang.lproj"
            printf '"CFBundleDisplayName" = "%s";\n' "گفتار به متن" > "$APP/$lang.lproj/InfoPlist.strings"
            printf '"CFBundleDisplayName" = "%s";\n' "دیکته‌ی فارسی" > "$KB/$lang.lproj/InfoPlist.strings"
          done
          plutil -lint "$APP/fa.lproj/InfoPlist.strings" "$KB/fa.lproj/InfoPlist.strings"
          # Ad-hoc sign nested code (framework, keyboard, app) so the bundle has the usual
          # signed layout; Sideloadly replaces these signatures with the Apple ID's.
          for fw in Payload/PersianSTT.app/Frameworks/*.framework; do codesign --force --sign - "$fw"; done
          codesign --force --sign - Payload/PersianSTT.app/PlugIns/PersianSTTKeyboard.appex
          codesign --force --sign - Payload/PersianSTT.app
          codesign -dv Payload/PersianSTT.app/PlugIns/PersianSTTKeyboard.appex 2>&1 | head -5
          zip -qry PersianSTT.ipa Payload
          ls -lh PersianSTT.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: PersianSTT-ipa
          path: PersianSTT.ipa
