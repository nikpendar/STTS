# Builds an unsigned KeylessShenava.ipa on a GitHub macOS runner (no local Mac/Xcode needed).
# Install the resulting .ipa with AltServer (Option-click > Sideload .ipa). With a free Apple ID,
# Sideloadly signs the keyboard extension with the app's profile and iOS kills it at launch.
# The speech model, Shenava Koochik (Core ML, 212 MB), is the separate ShenavaModel artifact,
# imported once in the app; KeylessShenavaEmbedded.ipa is the same app with the model inside
# (no import, no model page). The Whisper version is archived on branch archive/whisper.
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_model:
        description: "Put the model inside the IPA (200+ MB) instead of the separate ShenavaModel artifact"
        type: boolean
        default: false
  push:
    branches: [main]
    # Test and benchmark tooling does not change the app.
    paths-ignore:
      - ".github/workflows/benchmark.yml"
      - ".github/workflows/hf-search.yml"
      - ".github/workflows/screenshots.yml"
      - ".github/workflows/keyboard-test.yml"
      - ".github/workflows/live-test.yml"
      - ".github/workflows/logic-test.yml"
      - ".github/workflows/train.yml"
      - ".github/workflows/training-test.yml"
      - "training/**"
      - "Tests/**"
      - "scripts/**"

env:
  BUNDLE: ${{ github.event.inputs.bundle_model == 'true' }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Xcode 26 (iOS 26 SDK) compiles the keyboard's Liquid Glass glide trail; with an older
      # Xcode the trail is the plain one.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Download the speech model
        run: bash ./setup.sh "$([ "$BUNDLE" = true ] && echo bundle || echo model)"

      - uses: actions/upload-artifact@v5
        with:
          name: ShenavaModel
          path: build-model/Koochik.mlmodel
          retention-days: 90
          compression-level: 0

      - name: Build
        run: |
          # Settings the app is built with (TRAINING_REPO), from config.env.
          set -a; . ./config.env; set +a
          xcodebuild -project PersianSTT.xcodeproj -target PersianSTT \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            TRAINING_REPO="$TRAINING_REPO" \
            build
          plutil -p build/Release-iphoneos/PersianSTT.app/Info.plist | grep TrainingRepository

      - name: Package IPA
        env:
          FONT_KEY: ${{ secrets.FONT_KEY }}
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PersianSTT.app Payload/
          # The dictation keyboard must be embedded, or iOS never lists it.
          ls Payload/PersianSTT.app/PlugIns/PersianSTTKeyboard.appex
          plutil -p Payload/PersianSTT.app/PlugIns/PersianSTTKeyboard.appex/Info.plist
          # AltServer names Apple App IDs after CFBundleDisplayName and rejects non-ASCII names,
          # so Info.plist gets English names and the Persian ones move to InfoPlist.strings.
          APP=Payload/PersianSTT.app
          KB=$APP/PlugIns/PersianSTTKeyboard.appex
          plutil -replace CFBundleDisplayName -string "PersianSTT" "$APP/Info.plist"
          plutil -replace CFBundleDisplayName -string "Persian Dictation" "$KB/Info.plist"
          for lang in Base en fa; do
            mkdir -p "$APP/$lang.lproj" "$KB/$lang.lproj"
            printf '"CFBundleDisplayName" = "%s";\n' "کیلس" > "$APP/$lang.lproj/InfoPlist.strings"
            printf '"CFBundleDisplayName" = "%s";\n' "کیلس" > "$KB/$lang.lproj/InfoPlist.strings"
          done
          plutil -lint "$APP/fa.lproj/InfoPlist.strings" "$KB/fa.lproj/InfoPlist.strings"
          # The app and key font (AppFont in Shared/DictationBridge.swift) is licensed, so the public
          # repository keeps it encrypted; the FONT_KEY secret decrypts it.
          if [ -n "$FONT_KEY" ]; then
            OPENSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
            [ -x "$OPENSSL" ] || OPENSSL=openssl
            "$OPENSSL" enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:FONT_KEY \
              -in fonts/AppFont.ttf.enc -out "$RUNNER_TEMP/AppFont.ttf"
            for dir in "$APP" "$KB"; do mkdir -p "$dir/Fonts"; cp "$RUNNER_TEMP/AppFont.ttf" "$dir/Fonts/"; done
            file "$APP/Fonts/AppFont.ttf"
          else
            echo "::warning::FONT_KEY secret is not set; the app uses the system font"
          fi
          # Ad-hoc sign nested code (keyboard, app) so the bundle has the usual signed layout;
          # AltServer replaces these signatures with the Apple ID's.
          codesign --force --sign - Payload/PersianSTT.app/PlugIns/PersianSTTKeyboard.appex
          codesign --force --sign - Payload/PersianSTT.app
          codesign -dv Payload/PersianSTT.app/PlugIns/PersianSTTKeyboard.appex 2>&1 | head -5
          zip -qry KeylessShenava.ipa Payload
          ls -lh KeylessShenava.ipa
          # The same app with the model compiled inside, where Transcriber finds it.
          # Only when config.env asks for it (BUILD_EMBEDDED=1).
          BUILD_EMBEDDED="$(sed -n 's/^BUILD_EMBEDDED=//p' config.env)"
          if [ "$BUILD_EMBEDDED" = 1 ] && [ ! -d PersianSTT/Models/Koochik.mlmodelc ]; then
            xcrun coremlcompiler compile build-model/Koochik.mlmodel "$RUNNER_TEMP/compiled" \
              --deployment-target 15.0 --platform ios
            cp -R "$RUNNER_TEMP/compiled/Koochik.mlmodelc" "$APP/Models/"
            codesign --force --sign - Payload/PersianSTT.app
            zip -qry KeylessShenavaEmbedded.ipa Payload
            ls -lh KeylessShenavaEmbedded.ipa
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: KeylessShenava
          path: KeylessShenava.ipa
          compression-level: 0

      - uses: actions/upload-artifact@v5
        if: hashFiles('KeylessShenavaEmbedded.ipa') != ''
        with:
          name: KeylessShenavaEmbedded
          path: KeylessShenavaEmbedded.ipa
          compression-level: 0
