# Automatic punctuation on speech (AutoPunctuation, Tests/PunctEval): paragraphs of 4 FLEURS and
# 4 Common Voice 17 clips each, read by the app's speech model (Tests/ShenavaCheck, pauses kept),
# punctuated with each way of turning the tagger's scores into marks (AutoPunctuation.Tuning),
# and scored against the references' own marks (scripts/punct_score.py). Changes nothing.
name: Punctuation on speech

on:
  push:
    branches: [batch-1021c]
    paths: [.github/workflows/punct-speech.yml, scripts/punct_paragraphs.py, scripts/punct_score.py, Tests/PunctEval/**, PersianSTT/AutoPunctuation.swift]
  workflow_dispatch:

jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FLEURS fa_ir test, 200 clips
        run: |
          base=https://huggingface.co/datasets/google/fleurs/resolve/main/data/fa_ir
          curl -fsSL --retry 3 -o test.tsv "$base/test.tsv"
          curl -fsSL --retry 3 -o test.tar.gz "$base/audio/test.tar.gz"
          tar xzf test.tar.gz
          mkdir -p fleurs-clips
          head -n 200 test.tsv | while IFS=$'\t' read -r id file raw norm rest; do
            src=$(find test -name "$file" | head -1)
            [ -n "$src" ] || continue
            python3 scripts/to_pcm16.py "$src" "fleurs-clips/$file" > /dev/null
            printf '%s\t%s\n' "$file" "$raw" >> fleurs-clips/refs.tsv
          done
          head -n 3 fleurs-clips/refs.tsv
          python3 scripts/punct_paragraphs.py fleurs-clips fleurs 4
      - name: Common Voice 17 fa test, 200 clips
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          base=https://huggingface.co/datasets/fsicoli/common_voice_17_0/resolve/main
          curl -fsSL --retry 3 -o cv.tsv "$base/transcript/fa/test.tsv"
          curl -fsSL --retry 3 -o cv.tar "$base/audio/fa/test/fa_test_0.tar"
          python3 scripts/prepare_cv.py cv.tsv cv.tar 200 cv-clips
          grep -c '؟' cv-clips/refs.tsv || true
          python3 scripts/punct_paragraphs.py cv-clips cv17 4
      - uses: actions/upload-artifact@v5
        with:
          name: paragraphs
          path: |
            fleurs
            cv17
          retention-days: 3

  eval:
    needs: clips
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: paragraphs
      - name: Models and tools
        run: |
          bash ./setup.sh model
          mkdir -p "$RUNNER_TEMP/Koochik.mlpackage"
          aa extract -d "$RUNNER_TEMP/Koochik.mlpackage" -i build-model/Koochik.aar
          xcrun coremlcompiler compile "$RUNNER_TEMP/Koochik.mlpackage" compiled --deployment-target 17.0 --platform ios
          xcrun swiftc -O -o shenava-check PersianSTT/ShenavaStream.swift Tests/ShenavaCheck/main.swift
          xcrun swiftc -O -o punct-eval PersianSTT/AutoPunctuation.swift Shared/PersonalDictionary.swift Tests/PunctEval/main.swift
          ls PersianSTT/Models/Punct
      - name: Transcribe, punctuate, score
        run: |
          for ds in fleurs cv17; do
            KEEP_PAUSES=1 ./shenava-check compiled/*.mlmodelc PersianSTT/Models "$ds" all | grep TIMING
            ./punct-eval PersianSTT/Models/Punct "$ds" "$ds.jsonl"
          done
          cat fleurs.jsonl cv17.jsonl > all.jsonl
          python3 scripts/punct_score.py all.jsonl fleurs:fleurs/refs.tsv cv17:cv17/refs.tsv | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          rows = [json.loads(l) for l in open("all.jsonl")]
          for r in rows[:0]: pass
          seen = 0
          for r in rows:
              if r["variant"] in ("base", "pause2-qword") and seen < 8:
                  print(r["clip"], r["variant"], r["text"][:300]); seen += 1
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: punct-speech
          path: |
            all.jsonl
            fleurs/refs.tsv
            cv17/refs.tsv
