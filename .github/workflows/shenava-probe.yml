# Prints the Shenava Core ML repo metadata files (README, manifest, preprocessor, export script) to the job log.
name: Shenava probe

on:
  push:
    branches: [claude/shenava-streaming-eval-enfpnp]
    paths: [.github/workflows/shenava-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for repo in Reza2kn/Shenava-Rizeh-v1.0-CoreML-iOS15-fp16 Reza2kn/Shenava-Koochik-1.0-CoreML-iOS15-fp16; do
            base=https://huggingface.co/$repo/resolve/main
            for f in README.md preprocessor.json $(curl -fsSL "https://huggingface.co/api/models/$repo" | python3 -c "import json,sys; print(' '.join(s['rfilename'] for s in json.load(sys.stdin)['siblings'] if s['rfilename'].endswith(('manifest.json','.py'))))"); do
              echo "===== $repo/$f"
              curl -fsSL "$base/$f"
              echo
            done
            echo "===== $repo/tokens.json (head)"
            curl -fsSL "$base/tokens.json" | head -c 1500
            echo
            echo "===== $repo/mel_filters (head)"
            curl -fsSL "$base/mel_filters_slaney_80x257.json" | head -c 300
            echo
          done
