name: Probe ML Kit
on:
  push:
    branches: [probe-mlkit]
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Frameworks and slices
        run: |
          mkdir w && cd w
          for url in https://dl.google.com/dl/cpdc/95473d50497208d4/MLKitDigitalInkRecognition-8.0.0.tar.gz \
                     https://dl.google.com/dl/cpdc/b14ff2c7cc91cb0f/MLKitMDD-10.0.0.tar.gz \
                     https://dl.google.com/dl/cpdc/00f258dabdb58dfa/MLKitCommon-14.0.0.tar.gz; do
            n=$(basename "$url" .tar.gz); mkdir -p "$n"; curl -sSL "$url" | tar xz -C "$n"
            find "$n" -maxdepth 4 | head -20
            find "$n" -name "*.framework" -maxdepth 4 | while read f; do b="$f/$(basename "$f" .framework)"; [ -f "$b" ] && { lipo -info "$b"; file "$b"; ls -la "$b"; }; du -sh "$f"; done
            find "$n" -name "*.bundle" | while read f; do du -sh "$f"; ls "$f" | head; done
            find "$n" -name "PrivacyInfo.xcprivacy" | head
          done
