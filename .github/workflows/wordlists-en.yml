# Builds the keyboard's English word list and next-word list (PersianSTTKeyboard/en_words.txt,
# en_bigrams.bin) with scripts/make_english_lists.py from wordfreq and a few files of English
# Wikipedia, and commits them to the branch the run is on. The log shows sample predictions.
name: Keyboard English word lists

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/make_english_lists.py
      - .github/workflows/wordlists-en.yml

permissions:
  contents: write

jobs:
  english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download part of English Wikipedia
        run: |
          pip install -q pyarrow numpy huggingface_hub wordfreq
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("wikimedia/wikipedia", repo_type="dataset",
                            allow_patterns="20231101.en/train-0000[0-3]-*", local_dir="wiki")
          PY
          ls -lh wiki/20231101.en

      - name: Build the lists
        run: python scripts/make_english_lists.py wiki/20231101.en/*.parquet PersianSTTKeyboard/en_words.txt PersianSTTKeyboard/en_bigrams.bin

      # Pushes made with the workflow token start no other workflow, so this builds no IPA.
      - name: Commit the lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersianSTTKeyboard/en_words.txt PersianSTTKeyboard/en_bigrams.bin
          git diff --cached --quiet && exit 0
          git commit -m "Update the English word lists from wordfreq and Wikipedia"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
