# Compiles the keyboard's word logic (suggestions, typo correction, spoken punctuation, numbers) with
# Tests/KeyboardLogic on a Mac and runs the checks; no simulator or app build needed.
name: Keyboard logic test

on:
  workflow_dispatch:
  push:
    paths:
      - PersianSTTKeyboard/Lexicon.swift
      - PersianSTTKeyboard/VoiceCommands.swift
      - PersianSTTKeyboard/SpokenNumbers.swift
      - PersianSTTKeyboard/TouchModel.swift
      - PersianSTTKeyboard/GlideDecoder.swift
      - PersianSTTKeyboard/fa_words.txt
      - PersianSTTKeyboard/fa_bigrams.bin
      - PersianSTTKeyboard/en_words.txt
      - PersianSTTKeyboard/en_bigrams.bin
      - Tests/KeyboardLogic/**
      - .github/workflows/logic-test.yml

jobs:
  logic:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build and run
        run: |
          # Errors and failed checks go to annotations, which are readable where the log is not.
          if ! swiftc -O -module-name KeyboardLogic PersianSTTKeyboard/Lexicon.swift PersianSTTKeyboard/VoiceCommands.swift \
            PersianSTTKeyboard/SpokenNumbers.swift PersianSTTKeyboard/TouchModel.swift PersianSTTKeyboard/GlideDecoder.swift \
            Tests/KeyboardLogic/main.swift \
            -o logic-test 2> build.txt; then
            grep "error:" build.txt | head -20 | sed 's/^/::error::/'
            exit 1
          fi
          set -o pipefail
          ./logic-test PersianSTTKeyboard | tee result.txt || { grep "^FAIL" result.txt | sed 's/^/::error::/'; exit 1; }
