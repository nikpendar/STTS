# Runs a folder of kaggle/ (run.py + kernel-metadata.json) as a private Kaggle notebook on the
# account in the secrets KAGGLE_USERNAME / KAGGLE_KEY, waits for it (up to 5.5 h here; Kaggle
# itself allows 12 h) and prints the end of its log. Outputs stay on Kaggle, except in fetch mode:
# the newest voice checkpoint of keyless-voice-train goes to the private Kaggle dataset
# keyless-voice-ckpt (the next training session resumes from it) and its ONNX export to the
# GitHub release tts-fa-keyless-wip.
# The kernel "speaker" trains on a speaker's own recordings, which must not be readable in this
# public repository: voice-data/<speaker>.sealed (scripts/speaker/sealed.py) opens only here, becomes
# the private Kaggle dataset keyless-voice-<speaker>, trains in the notebook keyless-voice-train-<speaker>,
# and in fetch mode the exported voices go to the release tts-<speaker>-sealed encrypted with the key that travels inside the sealed file.
name: Kaggle run

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: Folder under kaggle/
        required: true
        default: smoke
      mode:
        description: "run: push and wait; start: push only; log: wait for the last run and print its log; fetch: checkpoint to dataset + ONNX to release; pin: session-3 checkpoint to its own dataset"
        type: choice
        options: [run, start, log, fetch, pin]
        default: run
      speaker:
        description: "kernel speaker only: voice-data/<speaker>.sealed to train on"
        default: speaker1
  push:
    branches: [claude/project-thread-xaj97f]
    paths: [kaggle/smoke/**]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KERNEL: ${{ inputs.kernel || 'smoke' }}
      MODE: ${{ inputs.mode || 'run' }}
      SPEAKER: ${{ inputs.speaker || 'speaker1' }}
      # Notebook name; the speaker kernel runs as one notebook per speaker.
      KID: ${{ inputs.kernel == 'speaker' && format('keyless-voice-train-{0}', inputs.speaker || 'speaker1') || format('keyless-voice-{0}', inputs.kernel || 'smoke') }}
    steps:
      - uses: actions/checkout@v5
      - name: Kaggle tool
        run: |
          test -n "$KAGGLE_USERNAME" && test -n "$KAGGLE_KEY" || { echo "::error::KAGGLE_USERNAME / KAGGLE_KEY secrets missing"; exit 1; }
          pip install -q --upgrade kaggle && kaggle --version
      - name: Sealing key
        run: |
          pip install -q cryptography
          echo "seal speaker data to: $(python3 scripts/speaker/sealed.py pub)"
      - name: Speaker data
        if: env.KERNEL == 'speaker' && (env.MODE == 'run' || env.MODE == 'start')
        run: |
          DS="$KAGGLE_USERNAME/keyless-voice-$SPEAKER"
          python3 scripts/speaker/sealed.py open "voice-data/$SPEAKER.sealed" bundle.tar
          mkdir -p sp && tar -xf bundle.tar -C sp && rm bundle.tar sp/key.txt
          echo "$(ls sp | wc -l) files, $(sha256sum sp/metadata.csv | cut -c1-12)"
          printf '{"title": "keyless-voice-%s", "id": "%s", "licenses": [{"name": "other"}]}\n' "$SPEAKER" "$DS" > sp/dataset-metadata.json
          if kaggle datasets status "$DS" >/dev/null 2>&1; then
            kaggle datasets version -p sp -m "$(sha256sum sp/metadata.csv | cut -c1-12)" --delete-old-versions
          else
            kaggle datasets create -p sp
          fi
          rm -rf sp
          for i in $(seq 30); do
            S="$(kaggle datasets status "$DS" 2>&1 | tail -1)"; echo "dataset $S"
            case "$S" in *ready*) break;; esac
            sleep 20
          done
          sleep 30
      - name: Push
        if: env.MODE == 'run' || env.MODE == 'start'
        run: |
          if [ "$KERNEL" = speaker ]; then
            # One notebook per speaker, so speakers can train side by side.
            sed -i -e "s#keyless-voice-speaker1#keyless-voice-$SPEAKER#" -e "s#keyless-voice-speaker\"#$KID\"#g" "kaggle/$KERNEL/kernel-metadata.json"
          fi
          sed -i "s#KAGGLE_USER/#$KAGGLE_USERNAME/#g" "kaggle/$KERNEL/kernel-metadata.json"
          sed -i "s#\"KAGGLE_USER\"#\"$KAGGLE_USERNAME\"#" "kaggle/$KERNEL/run.py"
          kaggle kernels push -p "kaggle/$KERNEL" | tee push.txt
          grep -qiE "error|failed" push.txt && exit 1 || true
      - name: Wait and log
        if: env.MODE == 'run' || env.MODE == 'log'
        run: |
          ID="$KAGGLE_USERNAME/$KID"
          [ "$MODE" = log ] || sleep 60
          while true; do
            S="$(kaggle kernels status "$ID" 2>&1 | tail -1)"; echo "$(date -u +%H:%M) $S"
            case "$S" in *complete*|*COMPLETE*|*error*|*ERROR*|*cancel*|*CANCEL*) break;; esac
            sleep 120
          done
          mkdir -p out && kaggle kernels output "$ID" -p out --file-pattern ".*\\.(log|txt|json)$" 2>&1 | tail -3 || true
          ls -la out && cat out/*.txt 2>/dev/null || true
          LOG="$(ls out/*.log 2>/dev/null | head -1)"
          [ -n "$LOG" ] && python3 -c "import json,sys; [print(''.join(f'[{e.get(\"time\",0):.0f}s] ' + l for l in e.get('data','').splitlines(True)),end='') for e in json.load(open(sys.argv[1]))]" "$LOG" > log.txt
          [ -n "$LOG" ] && { echo "--- progress"; grep -aoE "Epoch [0-9]+:[^|]*\|[^|]*\|[^]]*\]" log.txt | tail -5; grep -aiE "cach|preprocess|sanity|max_time|Trainable|Total params" log.txt | head -20; grep -aE "\] (version|start from|speaker data|::warning|resume failed|training |checkpoints at)" log.txt | cut -c1-300; grep -aoE "\[[0-9]+s\] Epoch [0-9]+/" log.txt | tail -1; echo "--- end of log"; tail -150 log.txt; }
          case "$S" in *complete*|*COMPLETE*) ;; *) exit 1;; esac
      - name: Fetch speaker voices
        if: env.MODE == 'fetch' && env.KERNEL == 'speaker'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/speaker/sealed.py open "voice-data/$SPEAKER.sealed" bundle.tar
          KEY="$(tar -xOf bundle.tar ./key.txt)"; rm bundle.tar
          echo "::add-mask::$KEY"
          mkdir -p vo && kaggle kernels output "$KAGGLE_USERNAME/$KID" -p vo --file-pattern ".*(voice-[0-9]+\\.onnx|mana\\.onnx\\.json)$" 2>&1 | tail -3
          ls -la vo
          gh release view tts-$SPEAKER-sealed >/dev/null 2>&1 || gh release create tts-$SPEAKER-sealed --prerelease --target "$GITHUB_SHA" --title "Speaker pilot $SPEAKER (sealed)" --notes "Encrypted training outputs; not readable without the key."
          for f in vo/*; do
            python3 scripts/speaker/sealed.py enc "$KEY" "$f" "$(basename "$f").enc"
            gh release upload tts-$SPEAKER-sealed "$(basename "$f").enc" --clobber
            rm "$f" "$(basename "$f").enc"
          done
      - name: Pin the session-3 checkpoint
        if: env.MODE == 'pin'
        run: |
          # Kaggle notebooks may only attach a dataset's newest version, and keyless-voice-ckpt's newest is
          # session 4 (which read worse): session 3 (global_step 42000) becomes keyless-voice-ckpt3.
          pip install -q kagglehub
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p ds3
          python3 - <<'PY'
          import glob, os, shutil, kagglehub, torch
          user = os.environ["KAGGLE_USERNAME"]
          for v in (3, 2, 1, 4):
              try:
                  d = kagglehub.dataset_download(f"{user}/keyless-voice-ckpt/versions/{v}")
              except Exception as e:
                  print("version", v, "not available:", e); continue
              for path in glob.glob(f"{d}/**/*.ckpt", recursive=True):
                  step = torch.load(path, map_location="cpu", weights_only=False).get("global_step")
                  print("version", v, path, "step", step, flush=True)
                  if step == 42000:
                      shutil.copy(path, "ds3/last.ckpt"); raise SystemExit(0)
          raise SystemExit("session 3 (step 42000) not found")
          PY
          printf '{"title": "keyless-voice-ckpt3", "id": "%s/keyless-voice-ckpt3", "licenses": [{"name": "other"}]}\n' "$KAGGLE_USERNAME" > ds3/dataset-metadata.json
          if kaggle datasets status "$KAGGLE_USERNAME/keyless-voice-ckpt3" >/dev/null 2>&1; then
            kaggle datasets version -p ds3 -m "session 3, step 42000"
          else
            kaggle datasets create -p ds3
          fi
      - name: Fetch checkpoint
        if: env.MODE == 'fetch' && env.KERNEL != 'speaker'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="$KAGGLE_USERNAME/$KID"
          mkdir -p ck && kaggle kernels output "$ID" -p ck --file-pattern ".*(last\.ckpt|mana\.onnx\.json)$" 2>&1 | tail -3
          find ck -type f -exec ls -la {} \;
          CK="$(ls ck/last.ckpt 2>/dev/null || find ck -name 'last*.ckpt' | head -1)"
          [ -n "$CK" ] || CK="$(find ck -name '*.ckpt' -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2)"
          test -f "$CK"; echo "checkpoint $CK"
          git clone -q --depth 1 https://github.com/OHF-voice/piper1-gpl.git piper
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q scikit-build cmake ninja onnx onnxscript
          (cd piper && pip install -q -e '.[train]' && bash ./build_monotonic_align.sh)
          python3 -c "import torch; c = torch.load('$CK', map_location='cpu', weights_only=False); print('step', c.get('global_step'), 'epoch', c.get('epoch'))"
          printf '%s\n' "import functools, runpy, sys, torch" "_load = torch.load" \
            "torch.load = functools.wraps(_load)(lambda *a, **k: _load(*a, **{**k, 'weights_only': False}))" \
            "_export = torch.onnx.export" \
            "torch.onnx.export = functools.wraps(_export)(lambda *a, **k: _export(*a, **{**k, 'dynamo': False}))" \
            "runpy.run_module(sys.argv.pop(1), run_name='__main__', alter_sys=True)" > launch.py
          python3 launch.py piper.train.export_onnx --checkpoint "$CK" --output-file mana.onnx
          ls -la mana.onnx
          JSON="$(find ck -name mana.onnx.json | head -1)"
          gh release view tts-fa-keyless-wip >/dev/null 2>&1 || gh release create tts-fa-keyless-wip --prerelease --target "$GITHUB_SHA" --title "Avak voice (training)" --notes "Mana Piper fine-tuned on Mana-TTS with the app's phonemes; work in progress."
          gh release upload tts-fa-keyless-wip mana.onnx "$JSON" --clobber
          mkdir -p ds && mv "$CK" ds/last.ckpt
          printf '{"title": "keyless-voice-ckpt", "id": "%s/keyless-voice-ckpt", "licenses": [{"name": "other"}]}\n' "$KAGGLE_USERNAME" > ds/dataset-metadata.json
          if kaggle datasets status "$KAGGLE_USERNAME/keyless-voice-ckpt" >/dev/null 2>&1; then
            kaggle datasets version -p ds -m "checkpoint $(date -u +%F)"
          else
            kaggle datasets create -p ds
          fi
