# Runs a folder of kaggle/ (run.py + kernel-metadata.json) as a private Kaggle notebook on the
# account in the secrets KAGGLE_USERNAME / KAGGLE_KEY, waits for it (up to 5.5 h here; Kaggle
# itself allows 12 h) and prints the end of its log. Outputs stay on Kaggle.
name: Kaggle run

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: Folder under kaggle/
        required: true
        default: smoke
      wait:
        description: Wait for the end and print the log
        type: boolean
        default: true
  push:
    branches: [claude/project-thread-xaj97f]
    paths: [kaggle/smoke/**, .github/workflows/kaggle-run.yml]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KERNEL: ${{ inputs.kernel || 'smoke' }}
    steps:
      - uses: actions/checkout@v5
      - name: Kaggle tool
        run: |
          test -n "$KAGGLE_USERNAME" && test -n "$KAGGLE_KEY" || { echo "::error::KAGGLE_USERNAME / KAGGLE_KEY secrets missing"; exit 1; }
          pip install -q --upgrade kaggle && kaggle --version
      - name: Push
        run: |
          sed -i "s#KAGGLE_USER/#$KAGGLE_USERNAME/#" "kaggle/$KERNEL/kernel-metadata.json"
          kaggle kernels push -p "kaggle/$KERNEL" | tee push.txt
          grep -qiE "error|failed" push.txt && exit 1 || true
      - name: Wait and log
        if: ${{ inputs.wait != false }}
        run: |
          ID="$KAGGLE_USERNAME/keyless-voice-$KERNEL"
          sleep 60
          while true; do
            S="$(kaggle kernels status "$ID" 2>&1 | tail -1)"; echo "$(date -u +%H:%M) $S"
            case "$S" in *complete*|*COMPLETE*|*error*|*ERROR*|*cancel*|*CANCEL*) break;; esac
            sleep 120
          done
          mkdir -p out && kaggle kernels output "$ID" -p out >/dev/null 2>&1 || true
          ls -la out
          LOG="$(ls out/*.log 2>/dev/null | head -1)"
          [ -n "$LOG" ] && python3 -c "import json,sys; [print(e.get('data',''),end='') for e in json.load(open(sys.argv[1]))]" "$LOG" | tail -150
          case "$S" in *complete*|*COMPLETE*) ;; *) exit 1;; esac
