# Handwriting check: the keyboard's handwriting recognizer (Google ML Kit, Persian, on device;
# PersianSTTKeyboard/Handwriting.swift) on 300 Persian words written as pen strokes. No public set
# of Persian online handwriting exists, so the strokes are synthetic (scripts/ink_samples.py: words
# in Nastaliq, Ruqaa and a plain sans traced into strokes): a check that it reads Persian, and of
# its speed and memory, not its accuracy on a real hand. ML Kit cannot download its models in the
# simulator here (Intel code under Rosetta: "Download failed" for English and Persian alike, runs
# 41805224152 and 41806258966), so the reading itself runs on the phone: hold the handwriting pad's
# keyboard button (150 of these words, PersianSTTKeyboard/ink_samples.json). This builds the
# samples and the device app with the recognizer in the keyboard, as build.yml does.
name: Handwriting check

on:
  push:
    branches: [batch-1021c]
    paths: [.github/workflows/ink-eval.yml, scripts/ink_samples.py, Podfile, PersianSTTKeyboard/Handwriting.swift]
  workflow_dispatch:

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fonts and strokes
        run: |
          pip install -q uharfbuzz scikit-image fonttools pillow
          mkdir fonts-ink
          curl -fsSL -o fonts-ink/NotoNastaliqUrdu.ttf https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoNastaliqUrdu/hinted/ttf/NotoNastaliqUrdu-Regular.ttf
          curl -fsSL -o fonts-ink/ArefRuqaa.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Regular.ttf
          curl -fsSL -o fonts-ink/Vazirmatn.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf"
          python3 scripts/ink_samples.py PersianSTTKeyboard/fa_words.txt samples.json 300 fonts-ink/NotoNastaliqUrdu.ttf fonts-ink/ArefRuqaa.ttf fonts-ink/Vazirmatn.ttf
      - uses: actions/upload-artifact@v5
        with:
          name: ink-samples
          path: samples.json
          retention-days: 7

  device:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Device build with the recognizer in the keyboard
        run: |
          bash ./setup.sh sidecars
          pod install --repo-update
          xcodebuild -workspace PersianSTT.xcworkspace -scheme PersianSTT -configuration Release -sdk iphoneos \
            -destination generic/platform=iOS SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 \
            || { grep -E "error:|BUILD FAILED" build.log | head -n 40; exit 1; }
          KB=build/Release-iphoneos/PersianSTT.app/PlugIns/PersianSTTKeyboard.appex/PersianSTTKeyboard
          strings "$KB" | grep -c DigitalInkRecogni
          ls -l "$KB" build/Release-iphoneos/PersianSTT.app/PersianSTT
          du -sh build/Release-iphoneos/PersianSTT.app
